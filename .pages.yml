media: media
content:
  - name: blog
    label: Blog
    type: collection
    path: blog
    fields:
      - name: title
        label: Title
        type: string
      - name: date
        label: Date
        type: date
      - name: authors
        label: Authors
        type: string
        list: true
      - name: body
        label: Body
        type: rich-text
  - name: workflow-docs
    label: Workflow Docs
    type: collection
    path: docs
    fields:
      - name: title
        label: Title
        type: string
      - name: body
        label: Body
        type: rich-text
